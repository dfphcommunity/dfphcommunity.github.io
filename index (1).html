<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Directory</title>
<meta name="description" content="A searchable directory of useful websites.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070a0c; --surface:rgba(18,26,29,.72); --ink:#f1eee6; --muted:#a3a79f; --line:rgba(255,255,255,.12);
  --accent:#ffc83d; --accent-ink:#1a1204; --mark:#f2b705;
  color-scheme:dark;
}
*{-webkit-tap-highlight-color:transparent}
a,button,input,.status{outline:none}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{transition:background-color .4s ease,color .4s ease;margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{position:relative;z-index:2;max-width:820px;margin:0 auto;padding:clamp(20px,5vw,56px) 20px 80px}
h1{font-size:clamp(2.6rem,9vw,5rem);font-weight:800;line-height:.95;letter-spacing:-.04em;margin:0 0 14px;background:linear-gradient(180deg,#fff 10%,#ffd77a 85%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 18px rgba(255,160,40,.25))}
.lede{color:var(--muted);font-size:1.1rem;max-width:46ch;margin:0 0 32px}
.search{transition:border-color .25s ease,box-shadow .25s ease;width:100%;font:inherit;font-size:1.05rem;padding:14px 16px;border:2px solid rgba(255,255,255,.28);border-radius:10px;background:rgba(8,12,14,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:var(--ink)}
@media (hover:hover) and (pointer:fine){.chip:focus-visible,.row:focus-visible,.hint button:focus-visible{outline:2px solid color-mix(in srgb,var(--mark) 70%,transparent);outline-offset:2px}}
.search:focus{border-color:var(--mark);box-shadow:0 0 0 5px color-mix(in srgb,var(--mark) 16%,transparent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 8px}
.chip{transition:background-color .25s ease,color .25s ease,border-color .25s ease,transform .2s ease;font:inherit;font-size:.92rem;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--mark);color:var(--accent-ink);border-color:var(--mark);font-weight:600}
.count{color:var(--muted);font-size:.9rem;margin:20px 0 4px}
ul{list-style:none;margin:0;padding:0;position:relative}
li{border-top:1.5px solid var(--line);position:relative}
li:last-child{border-bottom:1.5px solid var(--line)}
.row{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:18px 6px;color:inherit;text-decoration:none;border-radius:8px;transition:background-color .25s ease,transform .25s ease}
.row:active{transform:scale(.992)}
@media (hover:hover){
  .row:hover{background:color-mix(in srgb,var(--surface) 65%,transparent)}
  .row:hover .name{background-size:100% 4px}
  .row:hover .ico{transform:scale(1.07) rotate(-2deg)}
  .chip:hover{border-color:var(--mark)}
  .status:hover{transform:translateY(-1px);border-color:var(--c)}
}
.ico{transition:transform .35s cubic-bezier(.34,1.56,.64,1);width:44px;height:44px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font-weight:800}
.ico img{width:26px;height:26px}
.ico.brand{position:relative;overflow:visible;background:#111;border-color:#111;color:#fff}
.ico.brand>svg{width:24px;height:24px}
.ico.brand>img{width:100%;height:100%;border-radius:9px;object-fit:cover}
.flag{position:absolute;right:-8px;bottom:-8px;width:26px;height:17px;border-radius:3px;border:2px solid var(--bg);overflow:hidden;line-height:0;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.flag svg,.flag img{width:100%;height:100%}
.flag img{object-fit:contain}
.flag:has(img){width:34px;height:24px;border:0;box-shadow:none;background:none;overflow:visible;right:-12px;bottom:-10px;filter:drop-shadow(0 0 2px rgba(255,255,255,.9))}
.flags{position:absolute;right:-8px;bottom:-8px;display:flex}
.flags .flag{position:static;width:22px;height:15px}
.flags .flag+.flag{margin-left:-8px}
.verified{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:.75rem;font-weight:600;color:#1d9bf0;vertical-align:middle}
.verified svg{width:16px;height:16px}
.name{font-size:1.25rem;font-weight:600;letter-spacing:-.01em;background:linear-gradient(var(--mark),var(--mark)) 0 100%/0 4px no-repeat;transition:background-size .35s cubic-bezier(.2,.8,.2,1);padding-bottom:1px}
.host{color:var(--muted);font-size:.85rem;margin-left:8px;font-weight:400}
.desc{margin:2px 0 8px;color:var(--muted)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:.78rem;padding:1px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.empty{padding:40px 0;color:var(--muted)}
.statusline{margin:0 0 4px}
.status{--c:#8b8fa3;display:inline-flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;padding:2px 11px 2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;user-select:none;transition:transform .2s ease,border-color .25s ease}
.status small{font-size:.75rem;font-weight:400;color:var(--muted)}
.cnt .num{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;transition:color .9s ease}
.cnt.up .num{color:#22c55e;transition:none}.cnt.down .num{color:#f59e0b;transition:none}
.status .lamp.blip{animation:blip .8s ease-out}
@keyframes blip{0%{transform:scale(1)}35%{transform:scale(1.7);box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 30%,transparent),0 0 16px var(--c)}100%{transform:scale(1)}}
.lamp{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 25%,transparent),0 0 8px var(--c)}
.s-unverified{--c:#8b8fa3}.s-login{--c:#8b8fa3}.s-online{--c:#22c55e}.s-closed{--c:#ef4444}.s-broken{--c:#8b8fa3}.s-unavailable{--c:#a78bfa}.s-online .lamp{animation:beat 2.6s ease-in-out infinite}
.s-active{--c:#22c55e}.s-down{--c:#f59e0b}.s-deleted{--c:#ef4444}.s-invalid{--c:#8b8fa3}.s-checking{--c:#5b8def}.s-blocked{--c:#8b8fa3}
.s-checking .lamp{animation:pulse 1s ease-in-out infinite}
.s-active .lamp{animation:beat 2.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
@keyframes beat{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 12%,transparent),0 0 12px var(--c)}}
@media (prefers-reduced-motion:reduce){.s-checking .lamp,.s-active .lamp,.s-online .lamp,.status .lamp.blip{animation:none}}
.hint{margin:10px 0 4px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--mark);border-radius:8px}
.hint button{font:inherit;font-weight:700;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.where{margin-left:8px;font-size:.75rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;white-space:nowrap}
/* ---- backdrop: dusk haze, tactical grid, vignette ---- */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:linear-gradient(#0b1316,#06090b)}
.glow{position:absolute;inset:0;background:radial-gradient(120% 58% at 50% 104%,rgba(255,150,40,.42),rgba(190,85,20,.14) 46%,transparent 72%),radial-gradient(70% 50% at 88% -6%,rgba(24,92,104,.38),transparent 70%),radial-gradient(60% 40% at 8% 30%,rgba(255,190,80,.07),transparent 70%);animation:breathe 8s ease-in-out infinite alternate}
@keyframes breathe{from{opacity:.82}to{opacity:1}}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,200,90,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,200,90,.045) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(90% 70% at 50% 40%,#000 20%,transparent 80%);mask-image:radial-gradient(90% 70% at 50% 40%,#000 20%,transparent 80%)}
.vignette{position:absolute;inset:0;background:radial-gradient(130% 100% at 50% 40%,transparent 55%,rgba(0,0,0,.6))}
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#embers-back{z-index:1}
#embers-front{z-index:3}

.foot{margin:48px 0 0;text-align:center;color:var(--muted);font-size:.8rem;letter-spacing:.02em;opacity:.8}
.chips[hidden]{display:none}
.subchips{margin:20px 0 14px;padding-top:20px;gap:10px;border-top:1.5px solid rgba(255,255,255,.22)}
.subchips .chip{font-size:.85rem;padding:4px 13px}
.pin{position:absolute;top:12px;right:0;width:38px;height:38px;display:grid;place-items:center;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:10px;transition:color .2s ease,background-color .2s ease,transform .2s ease}
.pin svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.pin:hover{color:var(--accent);background:var(--surface)}
.pin:active{transform:scale(.88)}
.pin[aria-pressed="true"]{color:var(--accent)}
.pin[aria-pressed="true"] svg{fill:currentColor;transform:rotate(-12deg)}
.pinned{margin:4px 0 26px}
.pinned[hidden]{display:none}
.pinhead{display:flex;align-items:center;gap:9px;margin:0 0 6px 6px;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.pinhead svg{width:16px;height:16px;fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pinhead small{font-size:.78rem;font-weight:400;letter-spacing:.04em;color:var(--muted)}
.creator .row{padding-right:46px}
.cbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 14px;padding:8px 12px;border:1.5px dashed var(--line);border-radius:12px;font-size:.82rem;color:var(--muted)}
.cbar[hidden]{display:none}
.cbar b{color:var(--accent);letter-spacing:.08em;text-transform:uppercase;font-size:.74rem}
.cbar button{font:inherit;font-size:.8rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 12px;cursor:pointer}
.cbar button:hover{border-color:var(--accent);color:var(--accent)}
/* ---- motion ---- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.hint:not([hidden]){animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.slot .where{display:inline-block;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
@media (prefers-reduced-motion:no-preference){
  .wrap>h1,.wrap>.lede,.wrap>.search,.wrap>.chips,.wrap>.count{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
  .wrap>.lede{animation-delay:.06s}.wrap>.search{animation-delay:.12s}.wrap>.chips{animation-delay:.18s}.wrap>.count{animation-delay:.24s}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-delay:0s!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="scene" id="scene" aria-hidden="true">
  <div class="glow"></div>
  <div class="grid"></div>
  <div class="vignette"></div>
</div>
<canvas id="embers-back" class="fx" aria-hidden="true"></canvas>
<main class="wrap">
  <h1>Site Directory</h1>
  <p class="lede">A hand-picked list of useful websites. Search, or filter by category.</p>
  <div id="cbar" class="cbar" hidden><b>Creator mode</b><span>Only you see the pin buttons.</span><button type="button" id="cpcopy">Copy pin list</button><button type="button" id="cexit">Exit</button></div>
  <input id="q" class="search" type="search" placeholder="Search sites" aria-label="Search sites" autocomplete="off">
  <section id="pinned" class="pinned" aria-label="Pinned sites" hidden>
    <h2 class="pinhead"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>Pinned <small id="pincount"></small></h2>
    <ul id="pinlist"></ul>
  </section>
  <div id="chips" class="chips" role="group" aria-label="Categories"></div>
  <div id="subchips" class="chips subchips" role="group" aria-label="Filter by app" hidden></div>
  <p id="count" class="count" aria-live="polite"></p>
  <p id="hint" class="hint" aria-live="polite" hidden></p>
  <ul id="list"></ul>
  <footer class="foot">This page is community-driven.</footer>
</main>
<canvas id="embers-front" class="fx" aria-hidden="true"></canvas>

      if (k === "empty") { li.className = "empty"; li.textContent = searching ? `No sites match \u201c${raw}\u201d. Try different words.` : "No sites in this tab yet."; }
      else li.innerHTML = rowHTML(s, searching);
    }
    li._fresh = fresh;
    return li;
  });
  let prev = null;
  lis.forEach(li => {
    let n = prev ? prev.nextElementSibling : list.firstElementChild;
    while (n && n.classList.contains("leaving")) n = n.nextElementSibling;
    if (n !== li) list.insertBefore(li, n);
    prev = li;
  });

  /* 4. animate: slide survivors, fade in newcomers, ease the height */
  if (move) {
    lis.forEach((li, n) => {
      if (li._fresh) {
        li.animate([{opacity: 0, transform: "translateY(12px)"}, {opacity: 1, transform: "none"}],
          {duration: 340, delay: Math.min(n, 8) * 40 + (animate ? 60 : 0), easing: EASE, fill: "backwards"});
      } else if (animate && rects.has(li)) {
        const d = rects.get(li) - li.getBoundingClientRect().top;
        if (Math.abs(d) > 1) li.animate([{transform: `translateY(${d}px)`}, {transform: "none"}], {duration: 320, easing: EASE});
      }
    });
    if (animate) {
      list.getAnimations().forEach(a => a.cancel());
      const h1 = list.offsetHeight;
      if (Math.abs(h1 - h0) > 1) {
        list.style.overflow = "hidden";
        const a = list.animate([{height: h0 + "px"}, {height: h1 + "px"}], {duration: 320, easing: EASE});
        a.onfinish = a.oncancel = () => { list.style.overflow = ""; };
      }
    }
  }
  lis.forEach(li => { li._fresh = false; });
  drawn = true;
}

/* ===== Gold embers & dust, layered front to back =====
   Every particle has a depth z (0 = far, 1 = near). Far ones are tiny, sharp, dim and slow; near ones are big,
   soft (out-of-focus), faster and drift more. Near ones (about 1 in 5) are drawn in FRONT of the page, the rest
   behind it. Scrolling moves near particles with the page and far ones barely at all (parallax), a slow wind
   gusts everything sideways, embers rise, flicker and cool as they climb, dust floats. */
function startEmbers(){
  const cBack = $("embers-back"), cFront = $("embers-front"); if (!cBack || !cFront) return;
  const ctx = [cBack.getContext("2d"), cFront.getContext("2d")];
  const reduce = window.matchMedia ? matchMedia("(prefers-reduced-motion: reduce)") : {matches: false};
  const rnd = (a, b) => a + Math.random() * (b - a), lerp = (a, b, t) => a + (b - a) * t;
  const mk = (r, g, b, sharp) => {
    const n = 64, c = document.createElement("canvas"); c.width = c.height = n;
    const x = c.getContext("2d"), gr = x.createRadialGradient(n / 2, n / 2, 0, n / 2, n / 2, n / 2);
    if (sharp) { gr.addColorStop(0, `rgba(${r},${g},${b},1)`); gr.addColorStop(.35, `rgba(${r},${g},${b},.85)`); gr.addColorStop(.55, `rgba(${r},${g},${b},.22)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`); }
    else { gr.addColorStop(0, `rgba(${r},${g},${b},.95)`); gr.addColorStop(.3, `rgba(${r},${g},${b},.5)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`); }
    x.fillStyle = gr; x.fillRect(0, 0, n, n); return c;
  };
  const SP = {
    gold:   [mk(255, 200, 70, true),  mk(255, 190, 60, false)],
    orange: [mk(255, 125, 35, true),  mk(255, 120, 30, false)],
    dust:   [mk(238, 212, 160, true), mk(230, 200, 150, false)]
  };
  let W = 0, H = 0, DPR = 1, parts = [], wind = 0, last = performance.now(), lastScroll = window.scrollY, px = .5, py = .5, tx = .5, ty = .5, raf = 0;

  function spawn(p, anywhere) {
    const ember = p.kind === "ember", m = p.size;
    p.x = rnd(-m, W + m);
    p.y = anywhere ? rnd(-m, H + m) : (ember ? H + m + rnd(0, 40) : (Math.random() < .5 ? -m : H + m));
    return p;
  }
  function make() {
    const z = Math.pow(Math.random(), 1.5), ember = Math.random() < .4;
    const size = lerp(ember ? 2.6 : 2.0, ember ? 22 : 17, Math.pow(z, 2.2)) * rnd(.8, 1.25);
    return {
      kind: ember ? "ember" : "dust", z, size, front: z > .72,
      sp: ember ? SP[Math.random() < .55 ? "gold" : "orange"] : SP.dust,
      soft: z > .45 ? 1 : 0,
      a: ember ? lerp(1.15, .42, z) : lerp(.55, .22, z),
      vy: ember ? -(lerp(18, 85, z)) * rnd(.6, 1.4) : rnd(-4, 3) * (.4 + z * 2),
      vx: rnd(-6, 6) * (.4 + z),
      sway: rnd(6, 24) * (.4 + z), swf: rnd(.4, 1.6), ph: rnd(0, 6.28), fl: rnd(5, 11),
      x: 0, y: 0
    };
  }
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 1.5); W = window.innerWidth; H = window.innerHeight;
    [cBack, cFront].forEach((c, i) => { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); ctx[i].setTransform(DPR, 0, 0, DPR, 0, 0); ctx[i].globalCompositeOperation = "lighter"; });
    const area = W * H, nd = Math.max(36, Math.min(120, area / 10000)), ne = Math.max(24, Math.min(80, area / 14000));
    parts = []; for (let i = 0; i < nd; i++) { let p = make(); while (p.kind !== "dust") p = make(); parts.push(spawn(p, true)); }
    for (let i = 0; i < ne; i++) { let p = make(); while (p.kind !== "ember") p = make(); parts.push(spawn(p, true)); }
  }

  function frame(now) {
    const dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now; const t = now / 1000;
    wind = Math.sin(t * .23) * 14 + Math.sin(t * .61 + 1.3) * 7;
    px += (tx - px) * .05; py += (ty - py) * .05;
    const sy = window.scrollY, ds = sy - lastScroll; lastScroll = sy;
    ctx[0].clearRect(0, 0, W, H); ctx[1].clearRect(0, 0, W, H);
    for (const p of parts) {
      const z = p.z, m = p.size * 1.5;
      p.y -= ds * z * .9;                                  /* parallax: near moves with the page, far barely */
      p.x += (p.vx + wind * (.35 + z) + Math.sin(t * p.swf + p.ph) * p.sway) * dt;
      p.y += p.vy * dt;
      if (p.kind === "dust") p.y += Math.cos(t * p.swf * .7 + p.ph) * 3 * dt;
      if (p.y < -m) { p.y = H + m; if (p.kind === "ember") p.x = rnd(-m, W + m); } else if (p.y > H + m) p.y = -m;
      if (p.x < -m) p.x = W + m; else if (p.x > W + m) p.x = -m;
      let a = p.a;
      if (p.kind === "ember") {
        a *= .62 + .38 * Math.sin(t * p.fl + p.ph);       /* flicker */
        a *= .3 + .7 * Math.max(0, Math.min(1, p.y / H + .15)); /* cools and fades as it rises */
      } else a *= .75 + .25 * Math.sin(t * .8 + p.ph);     /* dust glints slowly */
      if (a <= .01) continue;
      const x = p.x + (px - .5) * z * 34, y = p.y + (py - .5) * z * 20;
      const c = ctx[p.front ? 1 : 0], s = p.size * (p.soft ? 2.4 : 1.9);
      c.globalAlpha = a; c.drawImage(p.sp[p.soft], x - s / 2, y - s / 2, s, s);
    }
    raf = reduce.matches ? 0 : requestAnimationFrame(frame);
  }
  const go = () => { cancelAnimationFrame(raf); last = performance.now(); raf = requestAnimationFrame(frame); };
  window.addEventListener("resize", () => { clearTimeout(resize.t); resize.t = setTimeout(() => { resize(); if (reduce.matches) go(); }, 150); });
  window.addEventListener("pointermove", e => { if (e.pointerType === "mouse") { tx = e.clientX / W; ty = e.clientY / H; } }, {passive: true});
  document.addEventListener("visibilitychange", () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else if (!raf) go(); });
  if (reduce.addEventListener) reduce.addEventListener("change", go);
  resize(); go();

}
/* ===== Animated search placeholder: types a phrase, holds, erases, then moves on to a random related one ===== */
function startPlaceholder(){
  const q = $("q"); if (!q) return;
  const base = "Search sites";
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) { q.placeholder = base; return; }
  const LOOK = ["TikTok pages", "Facebook pages", "YouTube channels", "Instagram accounts", "Discord servers", "the official site",
    "Vietnam", "Indonesia", "Thailand", "Taiwan", "the Philippines", "Android downloads", "iOS downloads", "the Steam page",
    "clan forms", "the esports wiki", "verified pages"];
  const SEARCH = ["by app", "by country", "verified pages", "Discord servers", "download links", "official pages"];
  const pick = a => a[Math.floor(Math.random() * a.length)];
  let last = base;
  const next = () => {
    let p; do { p = Math.random() < .6 ? "Looking for " + pick(LOOK) + "\u2026" : "Search " + pick(SEARCH); } while (p === last);
    return (last = p);
  };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const idle = async () => { while (q.value || document.hidden) await sleep(400); };
  (async function loop(phrase) {
    for (;;) {
      await idle();
      for (let i = 1; i <= phrase.length; i++) { if (q.value) break; q.placeholder = phrase.slice(0, i) + "|"; await sleep(55 + Math.random() * 45); }
      for (let t = 0; t < 4 && !q.value; t++) { q.placeholder = phrase + (t % 2 ? "|" : ""); await sleep(420); }
      for (let i = phrase.length - 1; i >= 0; i--) { if (q.value) break; q.placeholder = phrase.slice(0, i) + (i ? "|" : ""); await sleep(24); }
      q.placeholder = base; await sleep(250);
      phrase = next();
    }
  })(base);
}
